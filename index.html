<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Professional portfolio showcasing full-stack development projects and technical skills">
  <title>Yash Raj - Full Stack Developer Portfolio</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0B0F14;
      color: #E5E7EB;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    
    #root {
      min-height: 100vh;
      position: relative;
    }

    /* Animated gradient background */
    .gradient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.4;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% {
        opacity: 0.4;
        transform: scale(1) rotate(0deg);
      }
      50% {
        opacity: 0.6;
        transform: scale(1.1) rotate(5deg);
      }
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: rgba(99, 102, 241, 0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) translateX(0) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(100px) scale(1);
        opacity: 0;
      }
    }

    /* Geometric shapes background */
    .geometric-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      opacity: 0.03;
    }

    .geometric-shape {
      position: absolute;
      border: 2px solid #6366F1;
      animation: rotateShape 20s linear infinite;
    }

    @keyframes rotateShape {
      0% {
        transform: rotate(0deg) scale(1);
      }
      50% {
        transform: rotate(180deg) scale(1.2);
      }
      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    /* Grid background */
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% {
        background-position: 0 0;
      }
      100% {
        background-position: 50px 50px;
      }
    }

    /* 3D Card effect */
    .card-3d {
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }

    .card-3d:hover {
      transform: perspective(1000px) rotateX(2deg) rotateY(-2deg) translateZ(10px);
    }

    /* Glowing effect */
    .glow {
      position: relative;
    }

    .glow::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #6366F1, #8B5CF6, #06B6D4);
      border-radius: inherit;
      opacity: 0;
      z-index: -1;
      filter: blur(20px);
      transition: opacity 0.3s ease;
    }

    .glow:hover::before {
      opacity: 0.7;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-size: 18px;
      color: #6366F1;
    }

    /* Spotlight effect */
    .spotlight {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    /* Glass morphism effect */
    .glass {
      background: rgba(17, 24, 39, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(99, 102, 241, 0.1);
    }

    /* Animated border */
    @keyframes borderGlow {
      0%, 100% {
        border-color: rgba(99, 102, 241, 0.3);
      }
      50% {
        border-color: rgba(99, 102, 241, 0.6);
      }
    }
  </style>
</head>
<body>
  <!-- Gradient Background -->
  <div class="gradient-bg"></div>
  
  <!-- Grid Background -->
  <div class="grid-bg"></div>
  
  <!-- Geometric Shapes -->
  <div class="geometric-bg" id="geometric-container"></div>
  
  <!-- Particles Container -->
  <div id="particles-container"></div>
  
  <!-- Spotlight -->
  <div class="spotlight" id="spotlight"></div>

  <div id="root">
    <div class="loading">Loading portfolio...</div>
  </div>

  <!-- React and ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <script>
    // Create floating particles
    function createParticles() {
      const container = document.getElementById('particles-container');
      const particleCount = 30;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
        particle.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(particle);
      }
    }

    // Create geometric shapes
    function createGeometricShapes() {
      const container = document.getElementById('geometric-container');
      const shapes = [
        { size: 300, top: '10%', left: '10%', duration: 25 },
        { size: 200, top: '60%', left: '70%', duration: 20 },
        { size: 150, top: '80%', left: '20%', duration: 30 },
        { size: 250, top: '30%', left: '80%', duration: 22 }
      ];

      shapes.forEach(shape => {
        const div = document.createElement('div');
        div.className = 'geometric-shape';
        div.style.width = shape.size + 'px';
        div.style.height = shape.size + 'px';
        div.style.top = shape.top;
        div.style.left = shape.left;
        div.style.animationDuration = shape.duration + 's';
        div.style.borderRadius = Math.random() > 0.5 ? '50%' : '20%';
        container.appendChild(div);
      });
    }

    // Spotlight effect following mouse
    document.addEventListener('mousemove', (e) => {
      const spotlight = document.getElementById('spotlight');
      spotlight.style.transform = `translate(${e.clientX - 300}px, ${e.clientY - 300}px)`;
    });

    // Initialize effects
    window.addEventListener('load', () => {
      createParticles();
      createGeometricShapes();
    });

    // Portfolio Component
    function Portfolio() {
      const [activeSection, setActiveSection] = React.useState('home');

      React.useEffect(() => {
        const handleScroll = () => {
          const sections = ['home', 'skills', 'projects', 'experience', 'contact'];
          const scrollPosition = window.scrollY + 100;

          for (const section of sections) {
            const element = document.getElementById(section);
            if (element) {
              const offsetTop = element.offsetTop;
              const offsetHeight = element.offsetHeight;
              if (scrollPosition >= offsetTop && scrollPosition < offsetTop + offsetHeight) {
                setActiveSection(section);
                break;
              }
            }
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollToSection = (sectionId) => {
        const element = document.getElementById(sectionId);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
        }
      };
//skills section

        Languages: ['JavaScript', 'Rust', 'Python', 'Java', 'C'],
        Frontend: ['React', 'Next.js', 'Tailwind CSS', 'HTML5', 'CSS3'],
        Backend: ['Node.js', 'Express', 'Django', 'REST APIs'],
        Databases: ['PostgreSQL', 'MongoDB',  'MySQL','Supabase'],
        Tools: ['Git', 'Docker', 'Railway', 'Render', 'Postman','Vercel']

          techStack: ['Rust', 'Cargo', 'PostgreSQL'],

              //my intro sections
            }, 'Full-stack developer who enjoys coding, shipping features, and improving things bit by bit, with experience in frontend and a stronger interest in backend.'),

                }

            )
          )
        ),

        // Skills Section
        React.createElement('section', {
          id: 'skills',
          style: {

          React.createElement('div', {
            style: { display: 'grid', gap: '32px' }
          },
            Object.entries(skills).map(([category, items]) =>
              React.createElement('div', { 
                key: category,
                className: 'glass card-3d',
                style: {
                  padding: '24px',
